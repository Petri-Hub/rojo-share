[project]
name = "rojo-share"
version = "0.1.2"
description = "Share Rojo development sessions with a WebSocket heartbeat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14,<4",
    "typer>=0.20,<1",
]

[project.scripts]
rojo-share = "rojo_share.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14", "pyinstaller>=6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
